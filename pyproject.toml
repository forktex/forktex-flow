[project]
name = "forktex-flow"
version = "1.0.0"
description = "Postgres-native durable workflows: BPMN-aligned process definitions, pipelines and schedules, built on the forktex substrate."
authors = [
    {name = "FORKTEX",email = "info@forktex.com"}
]
readme = "README.md"
license = "AGPL-3.0-or-later OR LicenseRef-ForkTex-Commercial"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.14,<4.0"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Software Development",
    "Topic :: System :: Distributed Computing",
    "Typing :: Typed",
]
dependencies = [
    "forktex>=1.0,<2",
    "sqlalchemy[asyncio]>=2.1.6",
    "asyncpg>=0.32",
    "pydantic>=2.14",
    "croniter>=6.2",
]


[project.urls]
"Homepage" = "https://forktex.com"
"Repository" = "https://github.com/forktex/forktex-flow"
"Documentation" = "https://github.com/forktex/forktex-flow/tree/master/docs"
"Changelog" = "https://github.com/forktex/forktex-flow/blob/master/CHANGELOG.md"
"Bug Tracker" = "https://github.com/forktex/forktex-flow/issues"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "forktex_flow", from = "src" }]
include = [
    { path = "src/forktex_flow/py.typed", format = ["sdist", "wheel"] },
    { path = "src/forktex_flow/persist/migrations/*.sql", format = ["sdist", "wheel"] },
]

[dependency-groups]
dev = [
    "pytest>=9.2",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.1",
    "ruff>=0.17.3",
    "pyright>=1.1.414",
    "pip-audit>=2.10.1",
    "build>=1.6.1",
    "twine>=7.0",
    "testcontainers[postgres]>=4.15",
    "alembic>=1.20",
    "pytest-timeout>=2.4",
]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E1", "E2", "E5", "I", "UP", "B", "SIM", "RUF", "ANN"]

[tool.pyright]
include = ["src"]
exclude = ["**/__pycache__"]
pythonVersion = "3.14"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
asyncio_mode = "auto"
timeout = 120
timeout_method = "thread"
testpaths = ["tests"]
norecursedirs = [".venv", "dist", "build"]
log_cli = false
log_level = "WARNING"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]
